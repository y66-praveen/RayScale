<p class="sub">Reflection simulator — click a mirror to select it — drag to move, ⧉ duplicate, ✕ delete. Scroll or pinch to zoom, drag empty space to pan.</p>
<div class="toolbar">
  <button class="add" onclick="addMirror('concave')">+ Concave mirror</button>
  <button class="add" onclick="addMirror('convex')">+ Convex mirror</button>
  <button class="add" onclick="addMirror('plane')">+ Plane mirror</button>
  <button class="reset" onclick="resetBench()">Reset bench</button>
  <div class="savebtns">
    <button class="add" onclick="saveToFile()">💾 Save</button>
    <button class="add" onclick="document.getElementById('loadFile').click()">📂 Load</button>
    <input type="file" id="loadFile" accept="application/json" style="display:none" onchange="loadFromFile(event)">
  </div>
</div>
<main>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="zoomctl">
      <button onclick="zoomBtn(1.3)" title="Zoom in">+</button>
      <button onclick="zoomBtn(0.77)" title="Zoom out">–</button>
      <button onclick="autoFit();draw()" title="Fit to bench">⤢</button>
    </div>
  </div>
  <div id="side">
    <div class="sec"><h4>Object</h4><div class="cardlist" id="objCards"></div></div>
    <div class="sec"><h4>Mirrors</h4><div class="cardlist" id="mirCards"></div></div>
  </div>
</main>
