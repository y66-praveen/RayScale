<p class="sub">Refraction simulator — add a lens or a glass slab, drag to reposition, move the object to change the ray's angle into the slab.</p>
<div class="toolbar">
  <button class="add" onclick="addEl('convexlens')">+ Convex lens</button>
  <button class="add" onclick="addEl('concavelens')">+ Concave lens</button>
  <button class="add" onclick="addEl('slab')">+ Glass slab</button>
  <button class="reset" onclick="resetBench()">Reset bench</button>
  <div class="savebtns">
    <button class="add" onclick="saveToFile()">💾 Save</button>
    <button class="add" onclick="document.getElementById('loadFile').click()">📂 Load</button>
    <input type="file" id="loadFile" accept="application/json" style="display:none" onchange="loadFromFile(event)">
  </div>
</div>
<main>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="zoomctl">
      <button onclick="zoomBtn(1.3)" title="Zoom in">+</button>
      <button onclick="zoomBtn(0.77)" title="Zoom out">–</button>
      <button onclick="autoFit();draw()" title="Fit to bench">⤢</button>
    </div>
  </div>
  <div id="side">
    <div class="sec"><h4>Object</h4><div class="cardlist" id="objCards"></div></div>
    <div class="sec"><h4>Elements</h4><div class="cardlist" id="mirCards"></div></div>
  </div>
